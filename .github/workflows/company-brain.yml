name: Company Brain

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/aqua-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/aqua-desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  live-falkordb:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:6.0.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/aqua-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/aqua-desktop/package-lock.json
      - run: npm ci
      - name: Start the loopback demo bridge
        env:
          FALKORDB_HOST: 127.0.0.1
          FALKORDB_PORT: 6379
          FALKORDB_GRAPH: AquaCompanyBrainCI
          FALKORDB_TLS: "false"
        run: |
          npm run dev -- --host 127.0.0.1 > company-brain-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:1420/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat company-brain-vite.log
          exit 1
      - name: Run the real FalkorDB workflow
        env:
          TEST_FALKORDB: "1"
          TEST_FALKORDB_BASE_URL: http://127.0.0.1:1420
          TEST_FALKORDB_ORIGIN: http://127.0.0.1:1420
        run: npm run test:integration
      - name: Upload bridge log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: company-brain-vite-log
          path: apps/aqua-desktop/company-brain-vite.log

  rust-source-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - run: rustfmt --edition 2021 --check core/src/company_brain.rs core/src/company_ingest.rs core/src/company_memory.rs core/src/company_retrieval.rs
