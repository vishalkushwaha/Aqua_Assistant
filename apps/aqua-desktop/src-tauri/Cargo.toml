
[package]
name = "aqua-desktop"
version = "0.1.3"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[workspace]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aqua-orb-placement = { path = "../../../adapters/orb_placement" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# The picture analysis runs a loop over every pixel of a window; unoptimised it takes ~25x longer, which the dev build would feel.
[profile.dev.package.aqua-orb-placement]
opt-level = 3

[profile.release]
codegen-units = 1
incremental = false
